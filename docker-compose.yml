version: '3.8'

services:
  # Web Application Service
  eo_tour_diary_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eo_tour_diary_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://epfo_admin:epfo_secure_password_2026@eo_tour_diary_db:5432/epfo_tour_diary?schema=public
      - JWT_SECRET=epfo_super_secret_jwt_key_2026
    depends_on:
      eo_tour_diary_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Database Service
  eo_tour_diary_db:
    image: postgres:16-alpine
    container_name: eo_tour_diary_db
    restart: always
    environment:
      POSTGRES_USER: epfo_admin
      POSTGRES_PASSWORD: epfo_secure_password_2026
      POSTGRES_DB: epfo_tour_diary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epfo_admin -d epfo_tour_diary"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
